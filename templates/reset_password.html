<!DOCTYPE html>
<html>

<head>
    <title>Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Reset Password</h1>
    {% if message %}
        <h3> {{ message }} </h3>
    {% endif %}

    <form method="POST"
          action="/patient/reset_password/{{ patient_id }}">

        <label>New Password:</label>

        <input type="password"
               name="password"
               placeholder="Enter new password"
               required>

        <label>Confirm Password:</label>

        <input type="password"
               name="confirm_password"
               placeholder="Confirm new password"
               required>

        <button type="submit">
            Change Password
        </button>

    </form>

</body>

</html>
