<!DOCTYPE html>
<html>

<head>
    <title>Clinic</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="card">

        {% if message_type == "wrong_password" %}

             <h1>{{ message }}</h1>

        <a href="{{ url }}">
            <button>Back to Login</button>
        </a>


        {% elif message_type == "appointment_booked" %}

           <h1>{{ message }}</h1>

        <a href="{{ url }}">
            <button>Show my Apoointments</button>
        </a>


        {% elif message_type == "time_slot" %}

           <h1>{{ message }}</h1>

        <a href="{{ url }}">
            <button>Show my Apoointments</button>
        </a>

        {% endif %}

    </div>

</body>

</html>
